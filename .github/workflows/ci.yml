name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only runs when the PERPLEXITY_API_KEY secret is configured, and never on
    # pull requests (forks don't get secrets anyway; same-repo PRs shouldn't
    # spend real Agent API calls on every push).
    if: ${{ github.event_name != 'pull_request' && secrets.PERPLEXITY_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Smoke test against the real Perplexity Agent API
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python scripts/smoke_test.py
